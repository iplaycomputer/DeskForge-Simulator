version: "3.9"
services:
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-startup-fail
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./html:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-qO", "-", "http://localhost:80/" ]
      interval: 5s
      timeout: 3s
      retries: 5
