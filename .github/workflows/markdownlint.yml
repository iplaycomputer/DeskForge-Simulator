name: markdownlint

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  lint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run markdownlint-cli2 (uses repo config)
        uses: DavidAnson/markdownlint-cli2-action@v17
